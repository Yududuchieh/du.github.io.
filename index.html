<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>網紅觀察器</title>
<style>
  :root{
    --bg:#eef4f3; --surface:#ffffff; --ink:#183d3a; --text:#33514e; --muted:#7c928f;
    --line:#dde8e6; --primary:#379392; --primary-d:#2c7574; --cyan:#4fb0c6;
    --blue:#4f86c6; --purple:#6c49b8; --coral:#ee7785;
    --yt:#ee7785; --ig:#6c49b8; --th:#4f86c6;
    --shadow:0 6px 24px rgba(24,61,58,.08);
    --cjk:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--cjk);background:var(--bg);color:var(--text);line-height:1.6;padding:0 18px 64px}
  .wrap{max-width:820px;margin:0 auto}

  header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:34px 0 22px;flex-wrap:wrap}
  .brand h1{color:var(--ink);font-size:26px;font-weight:900;letter-spacing:-.01em}
  .brand p{color:var(--muted);font-size:14px;margin-top:2px}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:700;transition:all .15s}
  .btn-refresh{background:var(--ink);color:#fff;padding:11px 18px;font-size:14px}
  .btn-refresh:hover{background:#0f2c2a}
  .btn-refresh:disabled{opacity:.5;cursor:default}

  .query{background:var(--surface);border-radius:16px;padding:18px;box-shadow:var(--shadow);display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
  select,input{font-family:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);background:#fff;outline:none}
  select{flex:0 0 130px}
  select:focus,input:focus{border-color:var(--primary)}
  input{flex:1;min-width:180px}
  .btn-go{background:var(--primary);color:#fff;padding:12px 22px;font-size:15px;flex:0 0 auto}
  .btn-go:hover{background:var(--primary-d)}
  .btn-go:disabled{opacity:.6;cursor:default}

  #toast{margin-top:14px;font-size:14px;padding:0}
  #toast.show{padding:12px 16px;border-radius:10px}
  #toast.ok{background:#e2f2ef;color:#1f6b64}
  #toast.err{background:#fbe6e9;color:#b23a4c}

  .grid{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .card{background:var(--surface);border-radius:16px;padding:18px;box-shadow:var(--shadow);border-top:4px solid var(--line)}
  .card.youtube{border-top-color:var(--yt)}
  .card.instagram{border-top-color:var(--ig)}
  .card.threads{border-top-color:var(--th)}
  .pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;padding:3px 10px;border-radius:999px;color:#fff}
  .pill.youtube{background:var(--yt)}.pill.instagram{background:var(--ig)}.pill.threads{background:var(--th)}
  .card h3{color:var(--ink);font-size:17px;font-weight:800;margin:10px 0 1px;line-height:1.3}
  .handle{color:var(--muted);font-size:13px}
  .big{color:var(--ink);font-size:30px;font-weight:900;letter-spacing:-.02em;margin-top:12px;line-height:1}
  .big span{font-size:13px;font-weight:600;color:var(--muted);margin-left:6px;letter-spacing:0}
  .sub{color:var(--muted);font-size:13px;margin-top:8px}
  .when{color:var(--muted);font-size:12px;margin-top:10px}
  .row{display:flex;gap:8px;margin-top:14px}
  .row button{flex:1;font-size:13px;padding:9px 0;border-radius:9px}
  .b1{background:#e8f2f0;color:var(--primary-d)}.b1:hover{background:#daebe8}
  .b2{background:#eef1f8;color:var(--blue)}.b2:hover{background:#e1e7f3}
  .b3{background:#fbecef;color:var(--coral)}.b3:hover{background:#f6dbe0}

  .empty{margin-top:40px;text-align:center;color:var(--muted);font-size:15px;line-height:2}

  /* chart panel */
  .backdrop{position:fixed;inset:0;background:rgba(24,61,58,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
  .backdrop.show{display:flex}
  .panel{background:#fff;border-radius:18px;padding:24px;max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .panel-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
  .panel-head h2{color:var(--ink);font-size:20px;font-weight:900}
  .panel-head .x{background:#eef4f3;color:var(--ink);border-radius:9px;padding:6px 12px;font-size:14px}
  .delta{font-size:14px;margin:4px 0 16px;color:var(--muted)}
  .delta b{font-weight:800}
  .up{color:#1f8a6b}.down{color:#b23a4c}
  svg{width:100%;height:auto;display:block}
  .thin{color:var(--muted);font-size:13px;text-align:center;padding:30px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>網紅觀察器</h1>
      <p>追蹤 YouTube · Instagram · Threads 的公開數據與成長曲線</p>
    </div>
    <button class="btn-refresh" id="refreshAll">更新全部</button>
  </header>

  <div class="query">
    <select id="platform">
      <option value="youtube">YouTube</option>
      <option value="instagram">Instagram</option>
      <option value="threads">Threads</option>
    </select>
    <input id="handle" placeholder="輸入帳號，不用加 @（例：MrBeast）">
    <button class="btn-go" id="go">查詢並記錄</button>
  </div>
  <div id="toast"></div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">還沒有追蹤任何帳號。<br>在上面選平台、輸入帳號，按「查詢並記錄」開始。</div>
</div>

<div class="backdrop" id="backdrop">
  <div class="panel">
    <div class="panel-head">
      <h2 id="p-title">成長曲線</h2>
      <button class="x" id="p-close">關閉</button>
    </div>
    <div class="delta" id="p-delta"></div>
    <div id="p-chart"></div>
  </div>
</div>

<script>
/* ===== 設定：把下面兩行換成你自己的（Supabase → Project Settings → API） ===== */
const SUPABASE_URL = "https://abctymgsumqiiltthusq.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFiY3R5bWdzdW1xaWlsdHRodXNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NTExMzMsImV4cCI6MjEwMTMyNzEzM30.YPmNwgTmVIqcgTWHmbqLnNzYD7zVbFASJHTe-fquZcg";
/* ========================================================================= */

const FN = SUPABASE_URL + "/functions/v1/kol";
const $ = (s) => document.querySelector(s);
const fmt = (n) => (n == null ? "—" : Number(n).toLocaleString("zh-TW"));
const LABEL = { youtube: "YouTube", instagram: "Instagram", threads: "Threads" };
const FOLLOWER_WORD = { youtube: "訂閱", instagram: "粉絲", threads: "粉絲" };

function toast(msg, kind) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "show " + kind;
  if (kind === "ok") setTimeout(() => (t.className = ""), 2600);
}

async function callFn(payload) {
  const res = await fetch(FN, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
    },
    body: JSON.stringify(payload),
  });
  const json = await res.json().catch(() => ({ error: "伺服器回應格式錯誤" }));
  if (!res.ok || json.error) throw new Error(json.error || ("錯誤 " + res.status));
  return json;
}

function fmtDate(s) {
  const d = new Date(s);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function cardHTML(a) {
  const L = a.latest || {};
  const word = FOLLOWER_WORD[a.platform] || "粉絲";
  const posts = L.post_count != null ? `貼文/影片 ${fmt(L.post_count)}` : "";
  const follow = L.following != null ? `追蹤中 ${fmt(L.following)}` : "";
  const sub = [posts, follow].filter(Boolean).join(" · ");
  return `<div class="card ${a.platform}">
    <span class="pill ${a.platform}">${LABEL[a.platform]}</span>
    <h3>${escapeHtml(a.display_name || a.handle)}</h3>
    <div class="handle">@${escapeHtml(a.handle)}</div>
    <div class="big">${fmt(L.followers)}<span>${word}</span></div>
    ${sub ? `<div class="sub">${sub}</div>` : ""}
    <div class="when">${L.captured_at ? "更新於 " + fmtDate(L.captured_at) : "尚未擷取"}</div>
    <div class="row">
      <button class="b1" data-act="chart" data-p="${a.platform}" data-h="${escapeAttr(a.handle)}">看成長</button>
      <button class="b2" data-act="update" data-p="${a.platform}" data-h="${escapeAttr(a.handle)}">更新</button>
      <button class="b3" data-act="remove" data-id="${a.id}" data-n="${escapeAttr(a.display_name || a.handle)}">刪除</button>
    </div>
  </div>`;
}

function escapeHtml(s){return String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function escapeAttr(s){return String(s??"").replace(/"/g,"&quot;").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

async function loadList() {
  try {
    const { accounts } = await callFn({ action: "list" });
    const grid = $("#grid");
    $("#empty").style.display = accounts.length ? "none" : "block";
    grid.innerHTML = accounts.map(cardHTML).join("");
  } catch (e) {
    toast(e.message, "err");
  }
}

async function track(platform, handle) {
  const h = (handle || "").replace(/^@/, "").trim();
  if (!h) return toast("請先輸入帳號", "err");
  toast("查詢中…", "ok");
  try {
    const r = await callFn({ action: "track", platform, handle: h });
    toast(`已記錄 ${r.account.display_name || h}：${fmt(r.snapshot.followers)}`, "ok");
    await loadList();
  } catch (e) {
    toast(e.message, "err");
  }
}

async function refreshAll() {
  const btn = $("#refreshAll");
  btn.disabled = true;
  const old = btn.textContent;
  try {
    const { accounts } = await callFn({ action: "list" });
    if (!accounts.length) { toast("還沒有帳號可以更新", "err"); return; }
    let done = 0;
    for (const a of accounts) {
      btn.textContent = `更新中 ${++done}/${accounts.length}`;
      try { await callFn({ action: "track", platform: a.platform, handle: a.handle }); }
      catch (e) { /* 單一失敗不中斷 */ }
    }
    toast(`已更新 ${accounts.length} 個帳號的最新數據`, "ok");
    await loadList();
  } catch (e) {
    toast(e.message, "err");
  } finally {
    btn.disabled = false;
    btn.textContent = old;
  }
}

/* ---- 成長曲線 ---- */
function buildChart(history) {
  const pts = history.filter(h => h.followers != null);
  if (pts.length < 2) {
    return `<div class="thin">資料還太少，多按幾次「更新」或每天跑一次「更新全部」，曲線就會出現。</div>`;
  }
  const W = 640, H = 260, pad = { l: 56, r: 20, t: 20, b: 34 };
  const xs = pts.map((_, i) => i);
  const ys = pts.map(p => p.followers);
  let min = Math.min(...ys), max = Math.max(...ys);
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  min -= span * 0.12; max += span * 0.12;
  const X = i => pad.l + (i / (pts.length - 1)) * (W - pad.l - pad.r);
  const Y = v => pad.t + (1 - (v - min) / (max - min)) * (H - pad.t - pad.b);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.followers).toFixed(1)}`).join(" ");
  const area = `${line} L${X(pts.length - 1).toFixed(1)},${(H - pad.b).toFixed(1)} L${X(0).toFixed(1)},${(H - pad.b).toFixed(1)} Z`;
  const yTicks = [max, (max + min) / 2, min].map(v => {
    const val = Math.round(v);
    return `<text x="${pad.l - 10}" y="${(Y(val) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#7c928f">${Number(val).toLocaleString("zh-TW")}</text>
            <line x1="${pad.l}" y1="${Y(val).toFixed(1)}" x2="${W - pad.r}" y2="${Y(val).toFixed(1)}" stroke="#eef4f3"/>`;
  }).join("");
  const dPad = (s) => { const d = new Date(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
  const xLabels = [0, Math.floor((pts.length - 1) / 2), pts.length - 1]
    .filter((v, i, arr) => arr.indexOf(v) === i)
    .map(i => `<text x="${X(i).toFixed(1)}" y="${H - 12}" text-anchor="middle" font-size="11" fill="#7c928f">${dPad(pts[i].captured_at)}</text>`)
    .join("");
  const dots = pts.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.followers).toFixed(1)}" r="3.5" fill="#379392"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    ${yTicks}${xLabels}
    <path d="${area}" fill="#379392" opacity="0.10"/>
    <path d="${line}" fill="none" stroke="#379392" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>`;
}

async function showChart(platform, handle) {
  try {
    const r = await callFn({ action: "history", platform, handle });
    $("#p-title").textContent = (r.display_name || handle) + " · 成長曲線";
    const pts = (r.history || []).filter(h => h.followers != null);
    let delta = "";
    if (pts.length >= 2) {
      const diff = pts[pts.length - 1].followers - pts[0].followers;
      const cls = diff >= 0 ? "up" : "down";
      const sign = diff >= 0 ? "+" : "";
      delta = `期間變化 <b class="${cls}">${sign}${fmt(diff)}</b>　目前 <b>${fmt(pts[pts.length - 1].followers)}</b>`;
    } else if (pts.length === 1) {
      delta = `目前 <b>${fmt(pts[0].followers)}</b>`;
    }
    $("#p-delta").innerHTML = delta;
    $("#p-chart").innerHTML = buildChart(r.history || []);
    $("#backdrop").classList.add("show");
  } catch (e) {
    toast(e.message, "err");
  }
}

async function remove(id, name) {
  if (!confirm(`確定要刪除「${name}」和它的所有歷史紀錄嗎？`)) return;
  try {
    await callFn({ action: "remove", account_id: id });
    toast("已刪除", "ok");
    await loadList();
  } catch (e) {
    toast(e.message, "err");
  }
}

/* ---- 事件 ---- */
$("#go").addEventListener("click", () => track($("#platform").value, $("#handle").value));
$("#handle").addEventListener("keydown", (e) => { if (e.key === "Enter") track($("#platform").value, $("#handle").value); });
$("#refreshAll").addEventListener("click", refreshAll);
$("#p-close").addEventListener("click", () => $("#backdrop").classList.remove("show"));
$("#backdrop").addEventListener("click", (e) => { if (e.target === $("#backdrop")) $("#backdrop").classList.remove("show"); });
$("#grid").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const act = b.dataset.act;
  if (act === "chart") showChart(b.dataset.p, b.dataset.h);
  else if (act === "update") track(b.dataset.p, b.dataset.h);
  else if (act === "remove") remove(b.dataset.id, b.dataset.n);
});

loadList();
</script>
</body>
</html>
